# Serves the built single-page app (web/dist). Listens on 8080 as an unprivileged user; the edge Caddy proxies to it.
server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Health check for Docker. Also carries the security headers (as everything does).
  location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Vite puts a content hash in every file name under /assets/: a file never changes under its name, so cache it for a year.
  # A missing asset is a real 404, never index.html (that would make the browser try to run HTML as a script).
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The page itself names the current hashed files, so it must always be re-checked.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Single-page app: any other path that is not a file is a client-side route (/login, /queue, /?ticket=...).
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
