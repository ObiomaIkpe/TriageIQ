# Sent on EVERY response (add_header ... always covers errors and redirects too).
# nginx's rule: a location that has its own add_header drops the server-level ones, so every location includes this file.
#
# Content-Security-Policy: only this site, plus Cloudflare Turnstile (the bot check on the public form) for scripts and its
# iframe. No inline scripts and no eval. style-src is 'self' only: the built app ships a stylesheet and sets no inline <style>.
# frame-ancestors 'none' means nobody may put this site in a frame (clickjacking). The browser calls only /api/* on this same origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Old browsers that do not know CSP frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# (Strict-Transport-Security is the edge Caddy's job: it terminates HTTPS. This container speaks plain http inside the edge network.)
