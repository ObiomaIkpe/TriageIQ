# Runs the edge Caddy on a LAPTOP, next to the production stack under test (deploy/local-test.sh does all of it):
#   - it uses Caddy's own local CA (Caddyfile.local-test: `local_certs`) instead of Let's Encrypt, and the host triageiq.localhost;
#   - it publishes on 127.0.0.1 only, on 8080 and 8443 (not 80 and 443, which need root and may be in use).
services:
  caddy:
    volumes:
      - ./Caddyfile.local-test:/etc/caddy/Caddyfile:ro
    environment:
      TRIAGEIQ_HOST: triageiq.localhost
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
