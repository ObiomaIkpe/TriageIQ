# Lets you test the PRODUCTION stack on your own machine, with the source code at hand. Use it TOGETHER with the prod file:
#   docker compose -f docker-compose.prod.yml -f docker-compose.local-test.yml ...
# (deploy/local-test.sh wraps all of this, and also starts the edge Caddy, see deploy/edge/.) It changes two things:
#   1. the three images are built from this repository instead of pulled from ghcr.io (and never pulled);
#   2. the web and gateway containers are ALSO published on 127.0.0.1 (never on the network), for poking at them directly.
# The "edge" network is not created here: deploy/local-test.sh creates a throwaway one (EDGE_NETWORK) and the edge Caddy joins it.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: never

  gateway-migrate:
    build:
      context: ../gateway
    pull_policy: never

  triageiq-gateway:
    build:
      context: ../gateway
    pull_policy: never
    ports:
      - "127.0.0.1:3001:3000"

  triageiq-web:
    build:
      context: ../web
      args:
        # Cloudflare's always-passes TEST site key. Local only: it is public by design, and only works with a test secret.
        VITE_TURNSTILE_SITE_KEY: ${LOCAL_TEST_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    pull_policy: never
    ports:
      - "127.0.0.1:8081:8080"
