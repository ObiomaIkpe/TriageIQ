# Lets you test the PRODUCTION stack on your own machine, with the source code at hand. Use it TOGETHER with the prod file:
#   docker compose -f docker-compose.prod.yml -f docker-compose.local-test.yml ...
# (deploy/local-test.sh wraps all of this.) It changes three things:
#   1. the three images are built from this repository instead of pulled from ghcr.io (and never pulled);
#   2. web and gateway are published on 127.0.0.1 ONLY (never on the network), and a small Caddy stands in for the edge stack:
#      https://localhost:8443 -> /api/* to the gateway (prefix stripped), everything else to web. Its certificate is
#      self-signed, so your browser will warn once;
#   3. the "edge" network is created here (on the server it is created by the edge stack).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: never

  gateway-migrate:
    build:
      context: ../gateway
    pull_policy: never

  gateway:
    build:
      context: ../gateway
    pull_policy: never
    ports:
      - "127.0.0.1:3001:3000"

  web:
    build:
      context: ../web
      args:
        # Cloudflare's always-passes TEST site key. Local only: it is public by design, and only works with a test secret.
        VITE_TURNSTILE_SITE_KEY: ${LOCAL_TEST_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    pull_policy: never
    ports:
      - "127.0.0.1:8081:8080"

  edge-sim:
    image: caddy:2.10-alpine
    restart: "no"
    volumes:
      - ./local-test.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8443:8443"
    mem_limit: 64m
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [edge]

networks:
  edge: !override
    name: triageiq-edge-local-test
