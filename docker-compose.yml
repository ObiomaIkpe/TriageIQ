services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: triageiq
      POSTGRES_PASSWORD: triageiq
      POSTGRES_DB: triageiq
    ports:
      - "5432:5432"
    volumes:
      - triageiq_pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://triageiq:triageiq@db:5432/triageiq
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  triageiq_pgdata: