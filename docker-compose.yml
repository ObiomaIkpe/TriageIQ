services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: triageiq
      POSTGRES_PASSWORD: triageiq
      POSTGRES_DB: triageiq
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - triageiq_pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://triageiq:triageiq@db:5432/triageiq
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - triageiq_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: ./gateway
    restart: unless-stopped
    # Must stay longer than TRIAGE_TIMEOUT_MS, so a running job can finish before the container is killed.
    stop_grace_period: 130s
    # The secrets (GATEWAY_CLIENTS) and RATE_LIMIT_PER_MINUTE come from gateway/.env.
    # If compose reports that file as missing: cp gateway/.env.example gateway/.env, then edit it.
    env_file:
      - path: gateway/.env
        required: true
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      TRIAGE_SERVICE_URL: http://app:8000
      WORKER_CONCURRENCY: "2"
      TRIAGE_TIMEOUT_MS: "120000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  triageiq_pgdata:
  triageiq_redisdata: