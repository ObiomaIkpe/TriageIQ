services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: triageiq
      POSTGRES_PASSWORD: triageiq
      POSTGRES_DB: triageiq
      # The password of the gateway's own database role (see db/gateway-db.sql). Read from the root
      # .env. The db service needs nothing else of the gateway's.
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?Set GATEWAY_DB_PASSWORD in .env (see README, Run the whole system)}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - triageiq_pgdata:/var/lib/postgresql/data
      # Runs once on a fresh volume and creates the gateway role and database. Existing volumes:
      # scripts/create_gateway_db.sh.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/gateway-db.sql:/gateway-db.sql:ro
    healthcheck:
      # Over TCP on purpose: while the image runs its init scripts its temporary server listens
      # only on the unix socket, so a check through the socket would pass too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U triageiq -d triageiq"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://triageiq:triageiq@db:5432/triageiq
    # No ports: the Python service is reached only by the gateway, at app:8000 on the compose
    # network. To publish it on localhost for debugging, add docker-compose.debug.yml.
    depends_on:
      - db

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - triageiq_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the gateway's database migrations, then exits. The gateway starts only after
  # it has finished successfully. The gateway itself never migrates.
  gateway-migrate:
    build: ./gateway
    command: ["node", "dist/database/migrate.js"]
    restart: "no"
    env_file:
      - path: gateway/.env
        required: true
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build: ./gateway
    restart: unless-stopped
    # Must stay longer than TRIAGE_TIMEOUT_MS, so a running job can finish before the container is killed.
    stop_grace_period: 130s
    # The secrets (GATEWAY_CLIENTS) and RATE_LIMIT_PER_MINUTE come from gateway/.env.
    # If compose reports that file as missing: cp gateway/.env.example gateway/.env, then edit it.
    env_file:
      - path: gateway/.env
        required: true
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      TRIAGE_SERVICE_URL: http://app:8000
      WORKER_CONCURRENCY: "2"
      TRIAGE_TIMEOUT_MS: "120000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
      gateway-migrate:
        condition: service_completed_successfully

volumes:
  triageiq_pgdata:
  triageiq_redisdata: