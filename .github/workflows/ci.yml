# Continuous integration: every pull request and every push to main runs all the test suites on GitHub's servers.
#
# Four jobs run in parallel and are independent of each other: python, gateway, web, docker-build.
# (The names of these jobs are the "checks" that branch protection on main should require.)
#
# No secrets of ours are used anywhere (publish-images signs in to ghcr.io with the automatic GITHUB_TOKEN). No model-provider key is set to a real value: the keys below are obviously fake, so a test
# that tried to call a model would fail loudly instead of spending money.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing but reading the repository, for every job. The ONE job that writes (publish-images, on pushes to main only) asks for
# packages: write itself, and nobody else has it.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going. Runs on main are NEVER cancelled: one
# of them may be publishing images, and a half-published set of images is worse than waiting for it to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The same image as docker-compose.yml. Its default superuser (triageiq) may create the *_test database the tests need.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triageiq
          POSTGRES_PASSWORD: triageiq
          POSTGRES_DB: triageiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triageiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Fake on purpose (tests/conftest.py forces fake keys too). A test that reached a real model provider would be refused.
      ANTHROPIC_API_KEY: ci-fake-key-not-a-real-key
      VOYAGE_API_KEY: ci-fake-key-not-a-real-key
      LANGSMITH_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      # Even a fake-key call could not leave the machine: this address refuses connections.
      ANTHROPIC_BASE_URL: http://127.0.0.1:9
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # the version of the Dockerfile (python:3.12-slim)
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Without a database: the integration tests must skip cleanly, and nothing else may need one.
      - name: Default suite (no database)
        run: python -m pytest -q -rs

      # With the database: the integration suite. A skipped test here means the database was not really used, so it fails the job.
      - name: Integration suite (pgvector Postgres)
        env:
          TEST_DATABASE_URL: postgresql://triageiq:triageiq@localhost:5432/triageiq_test
        run: |
          python -m pytest -q -rs -m integration | tee pytest-integration.log
          if grep -Eq "[0-9]+ skipped" pytest-integration.log; then
            echo "::error::integration tests were skipped: the database was not used"
            exit 1
          fi

  gateway:
    name: gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:8.10.3-alpine # the same tag as docker-compose.yml
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triageiq
          POSTGRES_PASSWORD: triageiq
          POSTGRES_DB: gateway_test # the e2e tests refuse any database whose name does not end in _test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triageiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NO_COLOR: "1"
    defaults:
      run:
        shell: bash
        working-directory: gateway
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # With Redis and Postgres available NOTHING may be skipped: a skipped e2e test would mean it silently tested nothing.
      - name: End-to-end tests (Redis and Postgres)
        env:
          REDIS_TEST_URL: redis://localhost:6379
          GATEWAY_TEST_DATABASE_URL: postgresql://triageiq:triageiq@localhost:5432/gateway_test
        run: |
          npm run test:e2e | tee e2e.log
          if grep -Eq "[0-9]+ skipped" e2e.log; then
            echo "::error::e2e tests were skipped: Redis or Postgres was not used"
            exit 1
          fi

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NO_COLOR: "1"
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only: nothing is pushed here (publishing is the publish-images job, after every check passed). The cache is GitHub's own.
      - name: Build the app image (Python)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: triageiq-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build the gateway image (Node)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gateway
          file: gateway/Dockerfile
          push: false
          load: true
          tags: triageiq-gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      # load: true keeps each image on this runner so the next steps can inspect and run it. The web site key is Cloudflare's public TEST key.
      - name: Build the web image (static site)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          push: false
          load: true
          tags: triageiq-web:ci
          build-args: |
            VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # The production deployment, tested on throwaway containers (nothing is started from the compose file itself).
      - name: Deploy folder is in step with db/ and the compose file is sound
        run: |
          deploy/tests/test-compose.sh
          deploy/tests/test-make-secrets.sh
          deploy/tests/test-deploy-script.sh
          deploy/tests/test-edge.sh
      - name: No env file, key or secret inside any of the three images
        run: deploy/tests/test-image-contents.sh triageiq-app:ci triageiq-gateway:ci triageiq-web:ci
      - name: Web image (non-root, SPA fallback, caching, security headers)
        run: deploy/tests/test-web-image.sh triageiq-web:ci
      - name: Database roles (fresh volume and existing volume)
        run: deploy/tests/test-roles.sh
      - name: Backup and restore, with row counts compared
        run: deploy/tests/test-backup-restore.sh

  # Publishes the three images to GitHub's container registry. Only on a push to main (a merged pull request), and only after
  # all four checks above passed. The ONLY job with permission to write packages. Pull requests never get here.
  publish-images:
    name: publish-images
    needs: [python, gateway, web, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names must be lower case, tags are sha-<7 characters of the commit> and main. Only github context values that
      # GitHub itself controls go into the shell, and through the environment, never pasted into the script text.
      - name: Work out the image names and tags
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          echo "prefix=ghcr.io/${OWNER,,}/triageiq" >> "$GITHUB_OUTPUT"
          echo "short=sha-${SHA::7}" >> "$GITHUB_OUTPUT"

      # The Turnstile SITE key is public (it is in every page that shows the widget): a repository VARIABLE, not a secret.
      # An image built without it would show a broken form, so stop here instead.
      - name: The Turnstile site key variable is set
        env:
          SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$SITE_KEY" ]; then
            echo "::error::The repository variable VITE_TURNSTILE_SITE_KEY is not set (Settings > Secrets and variables > Actions > Variables). The web image would have no Turnstile site key."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label ties each package to this repository (its permissions and README then follow the repository).
      - name: Push the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.names.outputs.prefix }}-app:${{ steps.names.outputs.short }}
            ${{ steps.names.outputs.prefix }}-app:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app

      - name: Push the gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gateway
          file: gateway/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.names.outputs.prefix }}-gateway:${{ steps.names.outputs.short }}
            ${{ steps.names.outputs.prefix }}-gateway:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gateway

      - name: Push the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ steps.names.outputs.prefix }}-web:${{ steps.names.outputs.short }}
            ${{ steps.names.outputs.prefix }}-web:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # No cache-from, on purpose: this image carries the site key, so it is always built from scratch.
